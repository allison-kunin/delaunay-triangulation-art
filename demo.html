<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="delaunay.js"></script>
    <script src="demo.js"></script>
    <title>Delaunay Triangulation Art</title>
    <link rel="stylesheet" href="style.css">
    <noscript>To use this site, please enable JavaScript.</noscript>
</head>

<body>
    <div class="page">
        <header class="site-header">
            <h1>Delaunay Triangulation Art</h1>
        </header>

        <div class="wrapper">
            <div class="sidenav">
                <a href="index.html">Home</a>
                <a class="active" href="demo.html">Demo</a>
            </div>

            <main class="main">
                <div>
                    <button class="fileButton" onclick="document.getElementById('imageLoader').click()">Upload image</button>
                    <input style="display: none" type="file" id="imageLoader" name="imageLoader" accept="image/*"/>
                </div>
                <canvas id="imageCanvas"></canvas>
                <div class="rangeslider">
                    <input type="range" min="10" max="1000" 
                        value="500" class="myslider" 
                        id="pointSlider" oninput="updateNumPointsValue(this.value)">
                    <p><span id="numPointsValue"></span></p>
                </div>
                
                <script>
                    let pointSlider = document.getElementById("pointSlider");
                    let numPointsValue = document.getElementById("numPointsValue");
                    numPointsValue.innerHTML = pointSlider.value;

                    pointSlider.oninput = function () {
                        numPointsValue.innerHTML = this.value;
                    }
                </script>

                <div>
                    <button class="inlineButton" id="generatePointsButton" onclick="generateRandomPoints()">Generate Points</button>
                    <button class="inlineButton" id="triangulateButton" onclick="createDelaunayTriangulation()">Create Triangulation</button>
                </div>
                
            </main>
        </div>
    </div>
</body>
